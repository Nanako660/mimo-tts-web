name: Release Application

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Prepare Release Artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          # Copy single-file standalone HTML
          cp dist/index.html "dist/mimo-tts-web-${TAG_NAME}.html"
          # Create zip archive of dist directory
          cd dist && zip -r "../mimo-tts-web-${TAG_NAME}.zip" . && cd ..

      - name: Extract Release Notes from CHANGELOG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.GITHUB_REF_NAME || '';
            const version = tag.replace(/^v/, '');
            let notes = '';
            
            if (fs.existsSync('CHANGELOG.md')) {
              const content = fs.readFileSync('CHANGELOG.md', 'utf8');
              // Matches ## [version] or ## version until the next ## [version] or end of file
              const regex = new RegExp(`##\\s*(?:\\[?v?${version.replace(/\./g, '\\.')}\\]?[^\\n]*)[\\s\\S]*?(?=(?:\\n##\\s*\\[?v?\\d+\\.\\d+\\.\\d+)|$)`);
              const match = content.match(regex);
              if (match && match[0]) {
                notes = match[0].trim();
              }
            }
            
            if (!notes) {
              notes = `### Release ${tag}\n\nXiaomi MiMo-TTS Studio Web Application standalone build.`;
            }
            
            fs.writeFileSync('RELEASE_NOTES.md', notes);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/mimo-tts-web-${{ github.ref_name }}.html
            mimo-tts-web-${{ github.ref_name }}.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
